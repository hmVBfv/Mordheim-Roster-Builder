name: Test, build & deploy to GitHub Pages

# Single workflow for CI + deployment. On every push to main it:
#   1. runs the full test suite (which itself rebuilds the single-file and
#      parity-checks modular vs. bundle),
#   2. publishes the MODULAR version (index.html + js/ + data/) to Pages.
#
# Pages is a static HTTP server, so the fetch()-based data loading works there
# — unlike double-clicking index.html locally over file://. The freshly built
# dist/mordheim-roster.html is included in the same artifact, so the single-
# file build is also reachable under the Pages URL.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Only the deploy job may publish: a pull request's build runs its own code
# and gets no more than reading (security review OPS-7). Actions are pinned
# to a commit, the tag in the comment.
permissions:
  contents: read

# One run per branch or pull request; a newer push cancels an in-progress
# run of the same ref. Master has a single group, so there is still only one
# deployment at a time, and one pull request no longer cancels another's build.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: npm }

      # A few legacy tests read the app's source with a dev dependency (acorn).
      - run: npm ci

      # Rebuilds dist/ and runs every test, including the modular<->single-file
      # parity check.
      - name: Test (rebuilds single-file + parity check)
        run: node test/run.mjs

      # The installed packages are not part of the site.
      - name: Drop the installed packages
        run: rm -rf node_modules */node_modules

      # .nojekyll disables Jekyll on Pages. Without it Jekyll drops every path
      # starting with an underscore — including data/_util.js — and the modular
      # app would 404 on load. Committed in the repo; re-asserted here so the
      # published artifact always carries it.
      - name: Ensure .nojekyll
        run: touch .nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Publish the repo root: index.html, js/, data/, vendor/, assets/,
          # and the freshly built dist/. All in-app paths are relative
          # (new URL('./x', import.meta.url)), so they resolve correctly under
          # the /<repo-name>/ Pages subpath.
          path: .

  # Deployment only runs for real pushes to main, not for pull requests.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

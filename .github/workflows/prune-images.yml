# Old images of the container package go (ADR 0028). Since branches publish nothing any more, what is
# left is the builds of branches from before, and the signatures that belong to them. Master's
# builds, :drill-broken, everything under 14 days and the platform images inside a multi-arch
# image stay (.github/scripts/images-to-prune.sh holds the rules and says why).
#
# Weekly, and by hand: "Run workflow" with dry run left on lists what would go and deletes nothing.
# Deleting a version of a package cannot be undone.
name: Prune images

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted, delete nothing
        type: boolean
        default: true
  schedule:
    - cron: '31 4 * * 1'

permissions:
  contents: read
  packages: write

concurrency:
  group: prune-images
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      PACKAGE: mordheim-roster
      # a scheduled run deletes; a run by hand only when asked to
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: The rules hold
        run: .github/scripts/test-images-to-prune.sh
      - name: Versions of the package
        run: |
          gh api --paginate "/users/$OWNER/packages/container/$PACKAGE/versions?per_page=100" | jq -s 'add // []' > "$RUNNER_TEMP/versions.json"
          echo "versions in the package: $(jq length "$RUNNER_TEMP/versions.json")"
      - name: Which tagged versions go
        run: |
          .github/scripts/images-to-prune.sh tagged < "$RUNNER_TEMP/versions.json" > "$RUNNER_TEMP/prune-tagged.txt"
          .github/scripts/images-to-prune.sh keep < "$RUNNER_TEMP/versions.json" > "$RUNNER_TEMP/keep.txt"
          echo "tagged to delete: $(wc -l < "$RUNNER_TEMP/prune-tagged.txt"), tagged that stay: $(wc -l < "$RUNNER_TEMP/keep.txt")"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The platform images inside what stays
        run: |
          # the digests of the children of every multi-arch image that stays; one that cannot be read stops the run,
          # so nothing untagged is deleted on a guess
          repo="ghcr.io/${OWNER,,}/$PACKAGE"
          : > "$RUNNER_TEMP/children.txt"
          while read -r digest; do
            docker buildx imagetools inspect "$repo@$digest" --raw | jq -r '.manifests[]?.digest' >> "$RUNNER_TEMP/children.txt"
          done < "$RUNNER_TEMP/keep.txt"
          sort -u -o "$RUNNER_TEMP/children.txt" "$RUNNER_TEMP/children.txt"
          n=$(wc -l < "$RUNNER_TEMP/children.txt")
          echo "children of what stays: $n"
          [ "$n" -gt 0 ] || { echo "no children found – the images that stay could not be read, nothing untagged is touched" >&2; exit 1; }
      - name: Which untagged versions go
        run: |
          .github/scripts/images-to-prune.sh untagged "$RUNNER_TEMP/children.txt" < "$RUNNER_TEMP/versions.json" > "$RUNNER_TEMP/prune-untagged.txt"
          {
            echo "### Prune images"
            echo
            echo "Versions in the package: $(jq length "$RUNNER_TEMP/versions.json") (dry run: $DRY_RUN)"
            echo
            echo "Tagged to delete: $(wc -l < "$RUNNER_TEMP/prune-tagged.txt"); untagged to delete: $(wc -l < "$RUNNER_TEMP/prune-untagged.txt")"
            echo
            echo '```'
            cat "$RUNNER_TEMP/prune-tagged.txt"
            echo '… and untagged, the first 40:'
            head -40 "$RUNNER_TEMP/prune-untagged.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/prune-tagged.txt" "$RUNNER_TEMP/prune-untagged.txt"
      - name: Delete
        if: env.DRY_RUN != 'true'
        run: |
          # the tagged ones first, then the platform images nothing lists any more
          while read -r id rest; do
            echo "deleting $id ($rest)"
            gh api -X DELETE "/users/$OWNER/packages/container/$PACKAGE/versions/$id"
          done < <(cat "$RUNNER_TEMP/prune-tagged.txt" "$RUNNER_TEMP/prune-untagged.txt")

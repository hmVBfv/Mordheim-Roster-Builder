# Fail2Ban filter for the Mordheim Campaign server (docs/security.md, Anmeldung).
# The server logs every failed login as one JSON line, "event" first and "ip"
# before any field a user controls (server/src/log.ts); Docker passes the
# container's lines to journald. server/test/log.test.ts checks this regex
# against the server's real line, CI once more with fail2ban-regex.
[Definition]
failregex = "event":"login_failed","ip":"<HOST>"
ignoreregex =
journalmatch = CONTAINER_NAME=roster-app
